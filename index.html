<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Your Name] | Mechanical Engineering</title>
<meta name="description" content="Mechanical engineering student at The Cooper Union. Race cars, wing research, and things built in the machine shop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f3f5; --sheet:#fafbfc; --ink:#12181f; --muted:#586473; --accent:#1f4e9c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Archivo","Helvetica Neue",Arial,sans-serif; font-size:1.0625rem; line-height:1.55; color:var(--ink); background:var(--bg); }
  a { color:var(--accent); text-underline-offset:3px; }
  a:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  .wrap { max-width:72rem; margin:0 auto; padding:0 1.25rem; }

  nav { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem 1.5rem; padding:1.25rem 0; font-size:.95rem; }
  nav ul { display:flex; gap:1.25rem; list-style:none; margin:0; padding:0; flex-wrap:wrap; }
  nav a { color:var(--ink); }

  header.hero { padding:1rem 0 2rem; }
  h1 { margin:0; font-stretch:62%; font-weight:800; font-size:clamp(3.5rem,13vw,9rem); line-height:.92; letter-spacing:-.01em; }
  .intro { max-width:36rem; margin:1.25rem 0 0; font-size:1.2rem; color:var(--muted); }

  .project { padding:1.5rem 0 2.5rem; }
  .strip { display:grid; grid-template-columns:1fr auto auto; background:var(--sheet); border:1.5px solid var(--ink); margin-bottom:.75rem; }
  .strip > * { padding:.55rem .9rem; border-right:1.5px solid var(--ink); }
  .strip > *:last-child { border-right:0; }
  .strip h2 { margin:0; font-size:1.2rem; font-weight:700; line-height:1.3; }
  .strip small { display:block; color:var(--muted); font-size:.8rem; line-height:1.3; }
  .strip div { font-weight:600; white-space:nowrap; }
  .blurb { max-width:44rem; margin:0 0 1rem; }

  .shots { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; }
  .shot { position:relative; padding:0; border:0; background:#dfe3e8; cursor:zoom-in; overflow:hidden; display:block; }
  .shot img { width:100%; height:100%; object-fit:cover; display:block; }
  .shot.main { grid-column:1 / -1; aspect-ratio:16/9; }
  .shot.thumb { aspect-ratio:4/3; }
  .shot.missing { cursor:default; display:grid; place-items:center; text-align:center; padding:1rem; color:var(--muted); font-size:.9rem; border:1.5px dashed var(--muted); background:transparent; }
  .shot.missing code { display:block; margin-top:.25rem; word-break:break-all; color:var(--ink); }

  dialog { border:0; padding:0; background:transparent; max-width:100vw; max-height:100vh; width:100vw; height:100vh; }
  dialog::backdrop { background:rgba(10,14,19,.92); }
  .box { height:100%; display:grid; grid-template-rows:1fr auto; padding:1rem; color:#fff; }
  .box img { max-width:100%; max-height:calc(100vh - 7rem); margin:auto; object-fit:contain; }
  .box .bar { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding-top:.75rem; font-size:.95rem; }
  .box button { background:#fff; color:var(--ink); border:0; padding:.5rem 1rem; font:inherit; font-weight:600; cursor:pointer; }

  footer { padding:2rem 0 4rem; color:var(--muted); }
  footer p { margin:.25rem 0; }

  @media (max-width:44rem) {
    .shots { grid-template-columns:repeat(2,1fr); }
    .strip { grid-template-columns:1fr 1fr; }
    .strip h2 { grid-column:1 / -1; border-right:0; border-bottom:1.5px solid var(--ink); }
    .strip div { white-space:normal; }
    .shot.main { aspect-ratio:4/3; }
  }
</style>
</head>
<body>

<div class="wrap">
  <nav aria-label="Primary">
    <strong>[Your Name]</strong>
    <ul>
      <li><a href="mailto:[your-email]">Email</a></li>
      <li><a href="[your-linkedin-url]">LinkedIn</a></li>
      <li><a href="[your-github-url]">GitHub</a></li>
      <li><a href="resume.pdf">Resume</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1>[Your Name]</h1>
    <p class="intro">Mechanical engineering student at The Cooper Union. I build race cars, test wings, and machine my own parts.</p>
  </header>

  <main id="work"></main>

  <footer>
    <p>Looking for a Summer 2027 aerospace engineering internship. Reach me at <a href="mailto:[your-email]">[your-email]</a>.</p>
    <p>&copy; 2026 [Your Name]</p>
  </footer>
</div>

<dialog id="box" aria-label="Image viewer">
  <div class="box">
    <img alt="">
    <div class="bar">
      <span id="cap"></span>
      <span>
        <button type="button" id="prev">Previous</button>
        <button type="button" id="next">Next</button>
        <button type="button" id="close">Close</button>
      </span>
    </div>
  </div>
</dialog>

<script>
/* ---------------------------------------------------------------
   EDIT HERE. For each project: put photos in the "images" folder,
   then list them as ["images/file-name.jpg", "Short description"].
   The FIRST image of each project is shown large. Add as many as you like.
   Missing files show a dashed box naming the file to add.
---------------------------------------------------------------- */
const projects = [
  { title: "Cooper Union Motorsports (Formula SAE)", role: "Chief Engineer", dates: "2025 to present",
    blurb: "Leading the team back to competition after four years without a new car. Chassis stiffness, suspension, and manufacturing.",
    images: [
      ["images/formula-sae-car.jpg", "The Formula SAE car"],
      ["images/formula-sae-chassis.jpg", "Chassis and shear panels"],
      ["images/formula-sae-ansys.jpg", "Ansys torsional stiffness model"],
      ["images/formula-sae-team.jpg", "The team"]
    ] },
  { title: "Dragonfly Flight Research", role: "Researcher", dates: "2025 to present",
    blurb: "Aerodynamics study using a tow tank I designed to test wing configurations.",
    images: [
      ["images/dragonfly-tow-tank.jpg", "Tow tank test rig"],
      ["images/dragonfly-wing.jpg", "Adjustable wing mount"],
      ["images/dragonfly-data.jpg", "Test data"]
    ] },
  { title: "Audi S6 Performance Build", role: "Builder", dates: "[Year] to present",
    blurb: "Data logging, tuning, and a redesigned charge air cooling system.",
    images: [
      ["images/s6-car.jpg", "The Audi S6"],
      ["images/s6-cooling.jpg", "Replumbed charge air cooling system"],
      ["images/s6-logs.jpg", "Data logs"]
    ] },
  { title: "FPV Drones", role: "Builder and pilot", dates: "2023 to present",
    blurb: "Custom builds, with PID and filter tuning from Blackbox gyro logs.",
    images: [
      ["images/fpv-drone.jpg", "FPV drone build"],
      ["images/fpv-blackbox.jpg", "Blackbox log"]
    ] },
  { title: "Fast 3D Printer", role: "Builder", dates: "2020 to present",
    blurb: "A high-speed printer tuned with resonance analysis and input shaping.",
    images: [
      ["images/printer.jpg", "The printer"],
      ["images/printer-resonance.jpg", "Resonance measurement"]
    ] },
  { title: "Machine Shop", role: "Manufacturing Lead", dates: "2025 to 2026",
    blurb: "Powertrain, brake, and pedal box parts machined on manual mills and lathes.",
    images: [
      ["images/machining-1.jpg", "Machining a part"],
      ["images/machining-2.jpg", "Finished components"]
    ] }
];

const work = document.getElementById("work");
projects.forEach((p, pi) => {
  const sec = document.createElement("section");
  sec.className = "project";
  sec.innerHTML = '<div class="strip"><h2></h2><div><small>Role</small><span class="r"></span></div><div><small>Dates</small><span class="d"></span></div></div><p class="blurb"></p><div class="shots"></div>';
  sec.querySelector("h2").textContent = p.title;
  sec.querySelector(".r").textContent = p.role;
  sec.querySelector(".d").textContent = p.dates;
  sec.querySelector(".blurb").textContent = p.blurb;
  const shots = sec.querySelector(".shots");
  p.images.forEach(([src, alt], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "shot " + (i === 0 ? "main" : "thumb");
    b.setAttribute("aria-label", "Enlarge: " + alt);
    const img = new Image();
    img.src = src; img.alt = alt;
    img.loading = (pi === 0 && i === 0) ? "eager" : "lazy";
    img.onerror = () => {
      b.classList.add("missing"); b.disabled = true; b.removeAttribute("aria-label");
      b.innerHTML = "<span>Add this photo:<code></code></span>";
      b.querySelector("code").textContent = src;
    };
    b.appendChild(img);
    b.addEventListener("click", () => openBox(sec, img));
    shots.appendChild(b);
  });
  work.appendChild(sec);
});

const box = document.getElementById("box");
const boxImg = box.querySelector("img");
const cap = document.getElementById("cap");
let list = [], idx = 0;
function show() {
  const im = list[idx];
  boxImg.src = im.currentSrc || im.src; boxImg.alt = im.alt;
  cap.textContent = im.alt + " (" + (idx + 1) + " of " + list.length + ")";
}
function step(d) { idx = (idx + d + list.length) % list.length; show(); }
function openBox(sec, img) {
  list = [...sec.querySelectorAll(".shot:not(.missing) img")];
  idx = Math.max(0, list.indexOf(img));
  show(); box.showModal();
}
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("close").onclick = () => box.close();
box.addEventListener("click", e => { if (e.target === box) box.close(); });
document.addEventListener("keydown", e => {
  if (!box.open) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
</script>
</body>
</html>
